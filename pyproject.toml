[project]
name = "rpa-agentico"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "browser-use>=0.12.1",
    "flask>=3.1.3",
    "gunicorn>=23.0",
    "playwright>=1.58.0",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

# Testes unitários ficam em testes_unitarios/. A pasta tests/ é de scripts RPA do ERP
# e NUNCA pode ser coletada pelo pytest (rodar um script de lá abre o ERP de verdade).
[tool.pytest.ini_options]
testpaths = ["testes_unitarios"]
norecursedirs = ["tests", "tools", "json_rpa", "templates", ".venv", ".git", "__pycache__"]
pythonpath = ["."]
addopts = "-q"
